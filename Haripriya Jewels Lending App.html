document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nts=\"{{ dashboardCounts }}\" borrowers=\"{{ dashSearchBorrowers }}\" loans=\"{{ dashSearchLoans }}\" recentactivity=\"{{ recentActivity }}\" overdue=\"{{ overdueBrief }}\" onopenborrower=\"{{ openBorrower }}\" onopenloan=\"{{ openLoan }}\" onnewborrower=\"{{ openNewBorrowerModal }}\" onnewloan=\"{{ openNewLoanModal }}\" ongoloans=\"{{ goLoans }}\" ongoborrowers=\"{{ goBorrowers }}\" ongoreports=\"{{ goReports }}\" ongopayments=\"{{ goPayments }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isBorrowersList }}\">\n          <dc-import name=\"BorrowersList\" hint-size=\"100%,600px\" borrowers=\"{{ filteredBorrowers }}\" search=\"{{ borrowerSearch }}\" onsearchchange=\"{{ onBorrowerSearchChange }}\" onopenborrower=\"{{ openBorrower }}\" onnewborrower=\"{{ openNewBorrowerModal }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isBorrowerDetail }}\">\n          <dc-import name=\"BorrowerDetail\" hint-size=\"100%,600px\" borrower=\"{{ selectedBorrower }}\" loans=\"{{ selectedBorrowerLoans }}\" onback=\"{{ goBorrowers }}\" onedit=\"{{ openEditBorrowerModal }}\" onopenloan=\"{{ openLoan }}\" onnewloan=\"{{ openNewLoanModalForBorrower }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isLoansList }}\">\n          <dc-import name=\"LoansList\" hint-size=\"100%,600px\" loans=\"{{ filteredLoans }}\" filters=\"{{ loanFilters }}\" onfilterchange=\"{{ onLoanFilterChange }}\" onopenloan=\"{{ openLoan }}\" onnewloan=\"{{ openNewLoanModal }}\" itemtypes=\"{{ itemTypeOptions }}\" metaltypes=\"{{ metalTypeOptions }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isLoanDetail }}\">\n          <dc-import name=\"LoanDetail\" hint-size=\"100%,600px\" loan=\"{{ selectedLoanEnriched }}\" onback=\"{{ goLoans }}\" onedit=\"{{ openEditLoanModal }}\" onaddpayment=\"{{ openPaymentModalForLoan }}\" onchangestatus=\"{{ onChangeLoanStatus }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isPaymentsList }}\">\n          <dc-import name=\"PaymentsList\" hint-size=\"100%,600px\" payments=\"{{ filteredPayments }}\" filters=\"{{ paymentFilters }}\" onfilterchange=\"{{ onPaymentFilterChange }}\" loanoptions=\"{{ loanOptionsForFilter }}\" onopenloan=\"{{ openLoan }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isReports }}\">\n          <dc-import name=\"Reports\" hint-size=\"100%,600px\" summary=\"{{ reportSummary }}\" outstandinginterest=\"{{ outstandingInterestReport }}\" overdue=\"{{ overdueLoansEnriched }}\" borrowersummary=\"{{ borrowerSummaryReport }}\" onopenloan=\"{{ openLoan }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAdmin }}\">\n          <dc-import name=\"AdminSettings\" hint-size=\"100%,600px\" tiers=\"{{ interestConfig.tiers }}\" onedittiers=\"{{ openTierModal }}\" adminusers=\"{{ adminUsers }}\" onnewuser=\"{{ openNewAdminUserModal }}\" ondeactivateuser=\"{{ onDeactivateUser }}\">\n          <\u002Fdc-import>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Modals -->\n  <dc-import name=\"BorrowerModal\" hint-size=\"100%,100%\" show=\"{{ showBorrowerModal }}\" form=\"{{ borrowerForm }}\" isedit=\"{{ !!editingBorrowerId }}\" onchange=\"{{ onBorrowerFormChange }}\" onsave=\"{{ onSaveBorrower }}\" onclose=\"{{ closeBorrowerModal }}\"><\u002Fdc-import>\n  <dc-import name=\"LoanModal\" hint-size=\"100%,100%\" show=\"{{ showLoanModal }}\" form=\"{{ loanForm }}\" isedit=\"{{ !!editingLoanId }}\" borrowers=\"{{ borrowers }}\" itemtypes=\"{{ itemTypeOptions }}\" metaltypes=\"{{ metalTypeOptions }}\" onchange=\"{{ onLoanFormChange }}\" onsave=\"{{ onSaveLoan }}\" onclose=\"{{ closeLoanModal }}\"><\u002Fdc-import>\n  <dc-import name=\"PaymentModal\" hint-size=\"100%,100%\" show=\"{{ showPaymentModal }}\" form=\"{{ paymentForm }}\" onchange=\"{{ onPaymentFormChange }}\" onsave=\"{{ onSavePayment }}\" onclose=\"{{ closePaymentModal }}\"><\u002Fdc-import>\n  <dc-import name=\"TierModal\" hint-size=\"100%,100%\" show=\"{{ showTierModal }}\" tiers=\"{{ tierDraft }}\" onchange=\"{{ onTierDraftChange }}\" onaddtier=\"{{ onAddTier }}\" onremovetier=\"{{ onRemoveTier }}\" onsave=\"{{ onSaveTiers }}\" onclose=\"{{ closeTierModal }}\"><\u002Fdc-import>\n  <dc-import name=\"AdminUserModal\" hint-size=\"100%,100%\" show=\"{{ showAdminUserModal }}\" form=\"{{ adminUserForm }}\" onchange=\"{{ onAdminUserFormChange }}\" onsave=\"{{ onSaveAdminUser }}\" onclose=\"{{ closeAdminUserModal }}\"><\u002Fdc-import>\n\n  <sc-if value=\"{{ toast }}\">\n    <div style=\"position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.25); animation: toastIn 0.25s ease;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\n// ---------- Helpers ----------\nfunction fmtCurrency(n) {\n  if (n === null || n === undefined || isNaN(n)) return '₹0';\n  return '₹' + Math.round(n).toLocaleString('en-IN');\n}\nfunction fmtDate(d) {\n  if (!d) return '—';\n  const dt = new Date(d);\n  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });\n}\nfunction daysBetween(a, b) {\n  return (new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24);\n}\nfunction getApplicableTier(tiers, amount) {\n  return tiers.find(t => amount >= t.minAmount && (t.maxAmount === null || amount <= t.maxAmount)) || tiers[tiers.length - 1];\n}\nfunction calcLoanInterest(loan, tiers) {\n  const payments = (loan.partialPayments || []).slice().sort((a, b) => new Date(a.paymentDate) - new Date(b.paymentDate));\n  let remainingPrincipal = loan.loanAmount;\n  let totalInterest = 0;\n  let currentDate = new Date(loan.loanDate);\n  let currentRate = loan.interestRate;\n  const today = new Date();\n\n  for (const p of payments) {\n    const pDate = new Date(p.paymentDate);\n    const years = Math.max(0, daysBetween(currentDate, pDate) / 365);\n    const amt = remainingPrincipal * Math.pow(1 + currentRate / 100, years);\n    totalInterest += (amt - remainingPrincipal);\n    remainingPrincipal -= p.amount;\n    currentDate = pDate;\n    const tier = getApplicableTier(tiers, Math.max(remainingPrincipal, 0));\n    if (tier) currentRate = tier.interestRate;\n  }\n  const finalYears = Math.max(0, daysBetween(currentDate, today) / 365);\n  const finalAmt = remainingPrincipal * Math.pow(1 + currentRate / 100, finalYears);\n  const finalInterest = finalAmt - remainingPrincipal;\n  totalInterest += finalInterest;\n\n  return {\n    principalRemaining: Math.round(remainingPrincipal * 100) / 100,\n    totalInterestAccrued: Math.round(totalInterest * 100) / 100,\n    totalAmountDue: Math.round((remainingPrincipal + totalInterest) * 100) / 100,\n    daysElapsed: Math.round(daysBetween(loan.loanDate, today)),\n    appliedRate: currentRate\n  };\n}\nfunction genLoanNumber(existing) {\n  const today = new Date();\n  const ymd = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');\n  const n = existing.filter(l => l.loanNumber.includes(ymd)).length + 1;\n  return 'LOAN-' + ymd + '-' + String(n).padStart(3, '0');\n}\nfunction uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 9); }\n\nconst STATUS_COLORS = {\n  active: { bg: '#eef4ee', fg: '#3d7a4f' },\n  closed: { bg: '#eeeeec', fg: '#6b6b66' },\n  defaulted: { bg: 'var(--danger-soft)', fg: '#b3413a' },\n  partial_payment: { bg: '#faf1e3', fg: '#a97a2a' }\n};\n\nfunction seedData() {\n  const borrowers = [\n    { _id: 'b1', name: 'Kavya Reddy', phone: '9840012345', email: 'kavya.reddy@gmail.com', address: '14 Anna Nagar 2nd St', city: 'Chennai', state: 'Tamil Nadu', pincode: '600040', aadharOrId: 'XXXX-XXXX-4521', cre
