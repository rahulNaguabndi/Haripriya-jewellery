<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}">
  <div style="position:fixed; inset:0; background:rgba(28,20,16,0.45); display:flex; align-items:center; justify-content:center; z-index:1000; font-family:'Jost',sans-serif;">
    <div style="width:560px; max-height:86vh; overflow:auto; background:var(--surface); border-radius:14px; padding:28px 30px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.35);">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <div style="font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700;">Interest tiers</div>
        <div onClick="{{ onClose }}" style="cursor:pointer; font-size:18px; color:var(--text-muted);">✕</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="2">
          <div style="border:1px solid var(--border); border-radius:10px; padding:14px; display:grid; grid-template-columns: 1fr 1fr 1fr auto; gap:10px; align-items:end;">
            <div>
              <div style="font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:4px;">Min amount (₹)</div>
              <input type="number" value="{{ t.minAmount }}" onChange="{{ t.onMinChange }}" style="width:100%; padding:8px 9px; border-radius:7px; border:1px solid var(--border); font-size:13px;" />
            </div>
            <div>
              <div style="font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:4px;">Max amount (blank = ∞)</div>
              <input type="text" value="{{ t.maxAmountDisplay }}" onChange="{{ t.onMaxChange }}" style="width:100%; padding:8px 9px; border-radius:7px; border:1px solid var(--border); font-size:13px;" />
            </div>
            <div>
              <div style="font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:4px;">Rate (%)</div>
              <input type="number" value="{{ t.interestRate }}" onChange="{{ t.onRateChange }}" style="width:100%; padding:8px 9px; border-radius:7px; border:1px solid var(--border); font-size:13px;" />
            </div>
            <div onClick="{{ t.onRemove }}" style="color:#b3413a; font-size:12.5px; font-weight:600; cursor:pointer; padding-bottom:8px;">Remove</div>
          </div>
        </sc-for>
      </div>

      <div onClick="{{ onAddTier }}" style="margin-top:14px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;">+ Add tier</div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:22px;">
        <button onClick="{{ onClose }}" style="background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;">Cancel</button>
        <button onClick="{{ onSave }}" style="background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;" style-hover="background:var(--ink-hover);">Save tiers</button>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 600, &quot;height&quot;: 480}}">
class Component extends DCLogic {
  renderVals() {
    const tiersRaw = this.props.tiers || [];
    const onChange = this.props.onChange || (() => {});
    const onRemoveTier = this.props.onRemoveTier || (() => {});
    const tiers = tiersRaw.map((t, idx) => ({
      ...t,
      maxAmountDisplay: t.maxAmount === null || t.maxAmount === undefined ? '' : t.maxAmount,
      onMinChange: (e) => onChange(idx, 'minAmount', e.target.value),
      onMaxChange: (e) => onChange(idx, 'maxAmount', e.target.value === '' ? null : e.target.value),
      onRateChange: (e) => onChange(idx, 'interestRate', e.target.value),
      onRemove: () => onRemoveTier(idx)
    }));
    return {
      show: !!this.props.show,
      tiers,
      onAddTier: this.props.onAddTier,
      onSave: this.props.onSave,
      onClose: this.props.onClose
    };
  }
}

</script>
</body>
</html>
