<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ show }}">
  <div style="position:fixed; inset:0; background:rgba(28,20,16,0.45); display:flex; align-items:center; justify-content:center; z-index:1000; font-family:'Jost',sans-serif;">
    <div style="width:560px; max-height:88vh; overflow:auto; background:var(--surface); border-radius:14px; padding:28px 30px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.35);">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <div style="font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:700;">{{ title }}</div>
        <div onClick="{{ onClose }}" style="cursor:pointer; font-size:18px; color:var(--text-muted);">✕</div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
        <div style="grid-column: span 2;">
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Borrower *</div>
          <select value="{{ form.borrowerId }}" onChange="{{ onBorrowerChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px;">
            <sc-for list="{{ borrowers }}" as="b" hint-placeholder-count="4">
              <option value="{{ b._id }}">{{ b.name }}</option>
            </sc-for>
          </select>
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Item type</div>
          <select value="{{ form.itemType }}" onChange="{{ onItemTypeChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px;">
            <sc-for list="{{ itemTypes }}" as="it" hint-placeholder-count="7">
              <option value="{{ it }}">{{ it }}</option>
            </sc-for>
          </select>
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Metal type</div>
          <select value="{{ form.metalType }}" onChange="{{ onMetalTypeChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px;">
            <sc-for list="{{ metalTypes }}" as="m" hint-placeholder-count="3">
              <option value="{{ m }}">{{ m }}</option>
            </sc-for>
          </select>
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Weight (grams)</div>
          <input type="number" value="{{ form.weight }}" onChange="{{ onWeightChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Purity</div>
          <input type="text" value="{{ form.purity }}" onChange="{{ onPurityChange }}" placeholder="22k / 925" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
        <div style="grid-column: span 2;">
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Description</div>
          <input type="text" value="{{ form.description }}" onChange="{{ onDescriptionChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Loan amount (₹) *</div>
          <input type="number" value="{{ form.loanAmount }}" onChange="{{ onAmountChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
        <div>
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Loan date</div>
          <input type="date" value="{{ form.loanDate }}" onChange="{{ onLoanDateChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
        <div style="grid-column: span 2;">
          <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;">Due date</div>
          <input type="date" value="{{ form.dueDate }}" onChange="{{ onDueDateChange }}" style="width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
        </div>
      </div>

      <div style="background:var(--hover); border-radius:8px; padding:10px 14px; margin-top:16px; font-size:12.5px; color:var(--text-muted);">Interest rate is auto-assigned from tiered configuration based on loan amount.</div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button onClick="{{ onClose }}" style="background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;">Cancel</button>
        <button onClick="{{ onSave }}" style="background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;" style-hover="background:var(--ink-hover);">{{ saveLabel }}</button>
      </div>
    </div>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 640, &quot;height&quot;: 560}}">
class Component extends DCLogic {
  renderVals() {
    const form = this.props.form || {};
    const onChange = this.props.onChange || (() => {});
    const field = (key) => (e) => onChange(key, e.target.value);
    return {
      show: !!this.props.show,
      form,
      borrowers: this.props.borrowers || [],
      itemTypes: this.props.itemTypes || [],
      metalTypes: this.props.metalTypes || [],
      title: this.props.isEdit ? 'Edit loan' : 'New loan',
      saveLabel: this.props.isEdit ? 'Save changes' : 'Create loan',
      onBorrowerChange: field('borrowerId'), onItemTypeChange: field('itemType'), onMetalTypeChange: field('metalType'),
      onWeightChange: field('weight'), onPurityChange: field('purity'), onDescriptionChange: field('description'),
      onAmountChange: field('loanAmount'), onLoanDateChange: field('loanDate'), onDueDateChange: field('dueDate'),
      onSave: this.props.onSave, onClose: this.props.onClose
    };
  }
}

</script>
</body>
</html>
