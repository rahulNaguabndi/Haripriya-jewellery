// ---------- Helpers ----------
function fmtCurrency(n) {
  if (n === null || n === undefined || isNaN(n)) return '₹0';
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function daysBetween(a, b) {
  return (new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24);
}
function getApplicableTier(tiers, amount) {
  return tiers.find(t => amount >= t.minAmount && (t.maxAmount === null || amount <= t.maxAmount)) || tiers[tiers.length - 1];
}
function calcLoanInterest(loan, tiers) {
  const payments = (loan.partialPayments || []).slice().sort((a, b) => new Date(a.paymentDate) - new Date(b.paymentDate));
  let remainingPrincipal = loan.loanAmount;
  let totalInterest = 0;
  let currentDate = new Date(loan.loanDate);
  let currentRate = loan.interestRate;
  const today = new Date();

  for (const p of payments) {
    const pDate = new Date(p.paymentDate);
    const years = Math.max(0, daysBetween(currentDate, pDate) / 365);
    const amt = remainingPrincipal * Math.pow(1 + currentRate / 100, years);
    totalInterest += (amt - remainingPrincipal);
    remainingPrincipal -= p.amount;
    currentDate = pDate;
    const tier = getApplicableTier(tiers, Math.max(remainingPrincipal, 0));
    if (tier) currentRate = tier.interestRate;
  }
  const finalYears = Math.max(0, daysBetween(currentDate, today) / 365);
  const finalAmt = remainingPrincipal * Math.pow(1 + currentRate / 100, finalYears);
  const finalInterest = finalAmt - remainingPrincipal;
  totalInterest += finalInterest;

  return {
    principalRemaining: Math.round(remainingPrincipal * 100) / 100,
    totalInterestAccrued: Math.round(totalInterest * 100) / 100,
    totalAmountDue: Math.round((remainingPrincipal + totalInterest) * 100) / 100,
    daysElapsed: Math.round(daysBetween(loan.loanDate, today)),
    appliedRate: currentRate
  };
}
function genLoanNumber(existing) {
  const today = new Date();
  const ymd = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  const n = existing.filter(l => l.loanNumber.includes(ymd)).length + 1;
  return 'LOAN-' + ymd + '-' + String(n).padStart(3, '0');
}
function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 9); }

      page: 'login',

      loans: seed.loans,
      interestConfig: seed.interestConfig,

      selectedLoanId: null,
      borrowerSearch: '',
      loanFilters: { status: 'all', metalType: 'all', itemType: 'all', minAmount: '', maxAmount: '', borrowerId: 'all' },
      paymentFilters: { dateFrom: '', dateTo: '', loanId: 'all' },

      showBorrowerModal: false, borrowerForm: { ...EMPTY_BORROWER_FORM }, editingBorrowerId: null,

      theme: (typeof localStorage !== 'undefined' && localStorage.getItem('haripriya_theme')) || 'light'
    };
  })();

  componentDidMount() {
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-theme', this.state.theme);
  }

  onToggleTheme = () => {
    const next = this.state.theme === 'dark' ? 'light' : 'dark';
    this.setState({ theme: next });
    if (typeof document !== 'undefined') document.documentElement.setAttribute('data-theme', next);
    if (typeof localStorage !== 'undefined') localStorage.setItem('haripriya_theme', next);
  };

  showToast(msg) {
    this.setState({ toast: msg });
    setTimeout(() => this.setState({ toast: null }), 2400);
  }

  // ---------- Login ----------
  onLoginEmailChange = (e) => this.setState(s => ({ loginForm: { ...s.loginForm, email: e.target.value, error: '' } }));
  onLoginPasswordChange = (e) => this.setState(s => ({ loginForm: { ...s.loginForm, password: e.target.value, error: '' } }));
  onLogin = () => {
    const { email, password } = this.state.loginForm;
    if (!email || !password) {
      this.setState(s => ({ loginForm: { ...s.loginForm, error: 'Enter email and password' } }));
      return;
    }
    this.setState({ loggedIn: true, page: 'dashboard' });
  };
  onLogout = () => this.setState({ loggedIn: false, page: 'login', loginForm: { email: '', password: '', error: '' } });

  // ---------- Nav ----------
  goDashboard = () => this.setState({ page: 'dashboard' });
  goBorrowers = () => this.setState({ page: 'borrowers', selectedBorrowerId: null });
  goLoans = () => this.setState({ page: 'loans', selectedLoanId: null });
  goPayments = () => this.setState({ page: 'payments' });
  goReports = () => this.setState({ page: 'reports' });
  goAdmin = () => this.setState({ page: 'admin' });

  openBorrower = (id) => this.setState({ page: 'borrowerDetail', selectedBorrowerId: id });
  openLoan = (id) => this.setState({ page: 'loanDetail', selectedLoanId: id });

  onDashboardVariantChange = (v) => this.setState({ dashboardVariant: v });

  // ---------- Borrower search / filters ----------
  onBorrowerSearchChange = (e) => this.setState({ borrowerSearch: e.target.value });
  onLoanFilterChange = (key, value) => this.setState(s => ({ loanFilters: { ...s.loanFilters, [key]: value } }));
  onPaymentFilterChange = (key, value) => this.setState(s => ({ paymentFilters: { ...s.paymentFilters, [key]: value } }));

  // ---------- Borrower modal ----------
  openNewBorrowerModal = () => this.setState({ showBorrowerModal: true, editingBorrowerId: null, borrowerForm: { ...EMPTY_BORROWER_FORM } });
  openEditBorrowerModal = (id) => {
    const b = this.state.borrowers.find(x => x._id === id);
    this.setState({ showBorrowerModal: true, editingBorrowerId: id, borrowerForm: { ...b } });
  };
  closeBorrowerModal = () => this.setState({ showBorrowerModal: false });
  onBorrowerFormChange = (key, value) => this.setState(s => ({ borrowerForm: { ...s.borrowerForm, [key]: value } }));
  onSaveBorrower = () => {
    const { borrowerForm, editingBorrowerId } = this.state;
    if (!borrowerForm.name) { this.showToast('Name is required'); return; }
    if (editingBorrowerId) {
      this.setState(s => ({
        borrowers: s.borrowers.map(b => b._id === editingBorrowerId ? { ...b, ...borrowerForm } : b),
        showBorrowerModal: false
      }));
      this.showToast('Borrower updated');
    } else {
      const newB = { ...borrowerForm, _id: uid('b'), createdAt: new Date().toISOString().slice(0, 10) };
      this.setState(s => ({ borrowers: [newB, ...s.borrowers], showBorrowerModal: false }));
      this.showToast('Borrower created');
    }
  };

  // ---------- Loan modal ----------
  openNewLoanModal = () => this.setState({ showLoanModal: true, editingLoanId: null, loanForm: { ...EMPTY_LOAN_FORM, borrowerId: this.state.borrowers[0] ? this.state.borrowers[0]._id : '' } });
  openNewLoanModalForBorrower = (borrowerId) => this.setState({ showLoanModal: true, editingLoanId: null, loanForm: { ...EMPTY_LOAN_FORM, borrowerId } });
  openEditLoanModal = (id) => {
    const l = this.state.loans.find(x => x._id === id);
    this.setState({ showLoanModal: true, editingLoanId: id, loanForm: { ...l } });
  };
  closeLoanModal = () => this.setState({ showLoanModal: false });
  onLoanFormChange = (key, value) => this.setState(s => ({ loanForm: { ...s.loanForm, [key]: value } }));
  onSaveLoan = () => {
    const { loanForm, editingLoanId, loans, interestConfig } = this.state;
    if (!loanForm.borrowerId || !loanForm.loanAmount) { this.showToast('Borrower and amount are required'); return; }
    const amount = parseFloat(loanForm.loanAmount);
    const tier = getApplicableTier(interestConfig.tiers, amount);
    if (editingLoanId) {
      this.setState(s => ({
        loans: s.loans.map(l => l._id === editingLoanId ? { ...l, ...loanForm, loanAmount: amount, weight: parseFloat(loanForm.weight) || 0 } : l),
        showLoanModal: false
      }));
      this.showToast('Loan updated');
    } else {
      const newLoan = {
        ...loanForm,
        _id: uid('l'),
        loanAmount: amount,
        weight: parseFloat(loanForm.weight) || 0,
        loanNumber: genLoanNumber(loans),
        status: 'active',
        interestRate: tier.interestRate,
        interestType: 'compound_annual',
        partialPayments: [],
        dueDate: loanForm.dueDate || new Date(new Date(loanForm.loanDate).setMonth(new Date(loanForm.loanDate).getMonth() + 6)).toISOString().slice(0, 10)
      };
      this.setState(s => ({ loans: [newLoan, ...s.loans], showLoanModal: false }));
      this.showToast('Loan created — ' + newLoan.loanNumber);
    }
  };
  onChangeLoanStatus = (loanId, status) => {
    this.setState(s => ({ loans: s.loans.map(l => l._id === loanId ? { ...l, status } : l) }));
    this.showToast('Status updated');
  };

  // ---------- Payment modal ----------
  openPaymentModalForLoan = (loanId) => this.setState({ showPaymentModal: true, paymentForm: { ...EMPTY_PAYMENT_FORM, loanId } });
  closePaymentModal = () => this.setState({ showPaymentModal: false });
  onPaymentFormChange = (key, value) => this.setState(s => ({ paymentForm: { ...s.paymentForm, [key]: value } }));
  onSavePayment = () => {
    const { paymentForm, loans } = this.state;
    const amount = parseFloat(paymentForm.amount);
    if (!paymentForm.loanId || !amount) { this.showToast('Amount is required'); return; }
    this.setState(s => ({
      loans: s.loans.map(l => {
        if (l._id !== paymentForm.loanId) return l;
        const payments = [...(l.partialPayments || []), { amount, paymentDate: paymentForm.paymentDate, notes: paymentForm.notes, paymentType: paymentForm.paymentType }];
        const totalPaid = payments.reduce((a, p) => a + p.amount, 0);
        let status = l.status;
        if (amount >= l.loanAmount * 0.98 && totalPaid >= l.loanAmount) status = 'closed';
        else status = 'partial_payment';
        return { ...l, partialPayments: payments, status };
      }),
      showPaymentModal: false
    }));
    this.showToast('Payment recorded');
  };

  // ---------- Tier modal ----------
  openTierModal = () => this.setState({ showTierModal: true, tierDraft: this.state.interestConfig.tiers.map(t => ({ ...t })) });
  closeTierModal = () => this.setState({ showTierModal: false });
  onTierDraftChange = (idx, key, value) => this.setState(s => ({
    tierDraft: s.tierDraft.map((t, i) => i === idx ? { ...t, [key]: value } : t)
  }));
  onAddTier = () => this.setState(s => ({ tierDraft: [...s.tierDraft, { minAmount: 0, maxAmount: null, interestRate: 24, description: 'New tier' }] }));
  onRemoveTier = (idx) => this.setState(s => ({ tierDraft: s.tierDraft.filter((_, i) => i !== idx) }));
  onSaveTiers = () => {
    const tiers = this.state.tierDraft.map(t => ({
      minAmount: parseFloat(t.minAmount) || 0,
      maxAmount: t.maxAmount === '' || t.maxAmount === null ? null : parseFloat(t.maxAmount),
      interestRate: parseFloat(t.interestRate) || 0,
      description: t.description || ''
    })).sort((a, b) => a.minAmount - b.minAmount);
    this.setState(s => ({ interestConfig: { ...s.interestConfig, tiers }, showTierModal: false }));
    this.showToast('Interest tiers updated');
  };

  // ---------- Admin user modal ----------
  openNewAdminUserModal = () => this.setState({ showAdminUserModal: true, adminUserForm: { ...EMPTY_ADMIN_USER_FORM } });
  closeAdminUserModal = () => this.setState({ showAdminUserModal: false });
  onAdminUserFormChange = (key, value) => this.setState(s => ({ adminUserForm: { ...s.adminUserForm, [key]: value } }));
  onSaveAdminUser = () => {
    const { adminUserForm } = this.state;
    if (!adminUserForm.email || !adminUserForm.fullName) { this.showToast('Email and name required'); return; }
    const newUser = { ...adminUserForm, _id: uid('u'), isActive: true, lastLogin: null };
    this.setState(s => ({ adminUsers: [...s.adminUsers, newUser], showAdminUserModal: false }));
    this.showToast('Admin user created');
  };
  onDeactivateUser = (id) => {
    this.setState(s => ({ adminUsers: s.adminUsers.map(u => u._id === id ? { ...u, isActive: !u.isActive } : u) }));
  };

  renderVals() {
    const s = this.state;
    const page = s.page;

    // Enrich loans with borrower name + interest calc
    const enrichLoan = (l) => {
      const borrower = s.borrowers.find(b => b._id === l.borrowerId);
      const interest = calcLoanInterest(l, s.interestConfig.tiers);
      const sc = STATUS_COLORS[l.status] || STATUS_COLORS.active;
      const totalPaid = (l.partialPayments || []).reduce((a, p) => a + p.amount, 0);
      return {
        ...l,
        borrowerName: borrower ? borrower.name : 'Unknown',
        loanAmountFmt: fmtCurrency(l.loanAmount),
        loanDateFmt: fmtDate(l.loanDate),
        dueDateFmt: fmtDate(l.dueDate),
        isOverdue: l.status === 'active' && new Date(l.dueDate) < new Date(),
        statusBg: sc.bg, statusFg: sc.fg,
        statusLabel: l.status.replace('_', ' '),
        totalPaidFmt: fmtCurrency(totalPaid),
        interest,
        interestAccruedFmt: fmtCurrency(interest.totalInterestAccrued),
        totalDueFmt: fmtCurrency(interest.totalAmountDue),
        principalRemainingFmt: fmtCurrency(interest.principalRemaining),
        paymentsEnriched: (l.partialPayments || []).map(p => ({ ...p, amountFmt: fmtCurrency(p.amount), paymentDateFmt: fmtDate(p.paymentDate) })).reverse()
      };
    };
    const allLoansEnriched = s.loans.map(enrichLoan);

    // Filtered loans
    const lf = s.loanFilters;
    const filteredLoans = allLoansEnriched.filter(l => {
      if (lf.status !== 'all' && l.status !== lf.status) return false;
      if (lf.metalType !== 'all' && l.metalType !== lf.metalType) return false;
      if (lf.itemType !== 'all' && l.itemType !== lf.itemType) return false;
      if (lf.borrowerId !== 'all' && l.borrowerId !== lf.borrowerId) return false;
      if (lf.minAmount && l.loanAmount < parseFloat(lf.minAmount)) return false;
      if (lf.maxAmount && l.loanAmount > parseFloat(lf.maxAmount)) return false;
      return true;
    });

    // Borrowers enriched with loan count
    const enrichedBorrowers = s.borrowers.map(b => {
      const bLoans = allLoansEnriched.filter(l => l.borrowerId === b._id);
      const activeLoans = bLoans.filter(l => l.status === 'active' || l.status === 'partial_payment');
      return {
        ...b,
        loanCount: bLoans.length,
        activeLoanCount: activeLoans.length,
        totalOutstanding: fmtCurrency(activeLoans.reduce((a, l) => a + l.interest.totalAmountDue, 0)),
        createdAtFmt: fmtDate(b.createdAt)
      };
    });
    const q = s.borrowerSearch.trim().toLowerCase();
    const filteredBorrowers = q ? enrichedBorrowers.filter(b => b.name.toLowerCase().includes(q) || (b.phone || '').includes(q)) : enrichedBorrowers;

    const selectedBorrower = s.selectedBorrowerId ? enrichedBorrowers.find(b => b._id === s.selectedBorrowerId) : null;
    const selectedBorrowerLoans = s.selectedBorrowerId ? allLoansEnriched.filter(l => l.borrowerId === s.selectedBorrowerId) : [];
    const selectedLoanEnriched = s.selectedLoanId ? allLoansEnriched.find(l => l._id === s.selectedLoanId) : null;

    // Payments (derived from all loans)
    const allPayments = [];
    s.loans.forEach(l => {
      const b = s.borrowers.find(x => x._id === l.borrowerId);
      (l.partialPayments || []).forEach((p, idx) => {
        allPayments.push({
          _id: l._id + '_p' + idx, loanId: l._id, loanNumber: l.loanNumber, borrowerName: b ? b.name : 'Unknown',
          amount: p.amount, amountFmt: fmtCurrency(p.amount), paymentDate: p.paymentDate, paymentDateFmt: fmtDate(p.paymentDate),
          paymentType: p.paymentType || 'cash', notes: p.notes || ''
        });
      });
    });
    allPayments.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));
    const pf = s.paymentFilters;
    const filteredPayments = allPayments.filter(p => {
      if (pf.loanId !== 'all' && p.loanId !== pf.loanId) return false;
      if (pf.dateFrom && new Date(p.paymentDate) < new Date(pf.dateFrom)) return false;
      if (pf.dateTo && new Date(p.paymentDate) > new Date(pf.dateTo)) return false;
      return true;
    });
    const recentPaymentsEnriched = allPayments.slice(0, 6);

    // Dashboard stats
    const activeLoans = allLoansEnriched.filter(l => l.status === 'active' || l.status === 'partial_payment');
    const overdueLoansEnriched = allLoansEnriched.filter(l => l.isOverdue);
    const totalOutstandingPrincipal = activeLoans.reduce((a, l) => a + l.interest.principalRemaining, 0);
    const totalInterestAccrued = activeLoans.reduce((a, l) => a + l.interest.totalInterestAccrued, 0);
    const totalDisbursed = s.loans.reduce((a, l) => a + l.loanAmount, 0);
    const totalCollected = allPayments.reduce((a, p) => a + p.amount, 0);

    const dashboardStats = {
      totalLoans: s.loans.length,
      activeLoans: activeLoans.length,
      closedLoans: s.loans.filter(l => l.status === 'closed').length,
      defaultedLoans: s.loans.filter(l => l.status === 'defaulted').length,
      overdueCount: overdueLoansEnriched.length,
      totalDisbursedFmt: fmtCurrency(totalDisbursed),
      totalOutstandingFmt: fmtCurrency(totalOutstandingPrincipal),
      totalInterestFmt: fmtCurrency(totalInterestAccrued),
      totalCollectedFmt: fmtCurrency(totalCollected),
      totalBorrowers: s.borrowers.length
    };

    const outstandingInterestReport = activeLoans.map(l => l).sort((a, b) => b.interest.totalInterestAccrued - a.interest.totalInterestAccrued);
    const borrowerSummaryReport = enrichedBorrowers.filter(b => b.loanCount > 0);

    const itemTypeOptions = ['Ring', 'Necklace', 'Bracelet', 'Bangles', 'Chain', 'Earrings', 'Pendant'];
    const metalTypeOptions = ['Gold', 'Silver', 'Platinum'];

    const pageGroup = { dashboard:'dashboard', borrowers:'borrowers', borrowerDetail:'borrowers', loans:'loans', loanDetail:'loans', payments:'payments', reports:'reports', admin:'admin' }[page] || 'dashboard';
    const navMapRaw = [
      { key: 'dashboard', label: 'Dashboard', onClick: this.goDashboard },
      { key: 'borrowers', label: 'Borrowers', onClick: this.goBorrowers },
      { key: 'loans', label: 'Loans', onClick: this.goLoans },
      { key: 'payments', label: 'Payments', onClick: this.goPayments },
      { key: 'reports', label: 'Reports', onClick: this.goReports },
      { key: 'admin', label: 'Admin', onClick: this.goAdmin }
    ];
    const navMap = navMapRaw.map(n => ({
      ...n,
      color: n.key === pageGroup ? '#F3E9D2' : '#C9B89A',
      underline: n.key === pageGroup ? 'var(--gold)' : 'transparent'
    }));

    // Non-financial dashboard data
    const dashboardCounts = {
      activeLoans: activeLoans.length,
      totalLoans: s.loans.length,
      totalBorrowers: s.borrowers.length,
      overdueCount: overdueLoansEnriched.length,
      closedLoans: s.loans.filter(l => l.status === 'closed').length,
      defaultedLoans: s.loans.filter(l => l.status === 'defaulted').length
    };
    const dashSearchLoans = allLoansEnriched.map(l => ({ _id: l._id, loanNumber: l.loanNumber, borrowerName: l.borrowerName, itemType: l.itemType, metalType: l.metalType, statusBg: l.statusBg, statusFg: l.statusFg, statusLabel: l.statusLabel }));
    const dashSearchBorrowers = enrichedBorrowers.map(b => ({ _id: b._id, name: b.name, phone: b.phone, city: b.city }));
    // Recent activity (non-financial): loan openings + payment events, no amounts
    const activityEvents = [];
    s.loans.forEach(l => {
      const b = s.borrowers.find(x => x._id === l.borrowerId);
      const name = b ? b.name : 'Unknown';
      activityEvents.push({ _id: 'a_'+l._id, kind: 'loan', title: 'Loan opened · ' + l.loanNumber, sub: name + ' · ' + l.itemType, date: l.loanDate, dateFmt: fmtDate(l.loanDate), loanId: l._id });
      (l.partialPayments || []).forEach((p, i) => {
        activityEvents.push({ _id: 'a_'+l._id+'_'+i, kind: 'payment', title: 'Payment recorded · ' + l.loanNumber, sub: name, date: p.paymentDate, dateFmt: fmtDate(p.paymentDate), loanId: l._id });
      });
    });
    activityEvents.sort((a, b) => new Date(b.date) - new Date(a.date));
    const recentActivity = activityEvents.slice(0, 7);
    const overdueBrief = overdueLoansEnriched.map(l => ({ _id: l._id, loanNumber: l.loanNumber, borrowerName: l.borrowerName, dueDateFmt: l.dueDateFmt }));


    return {
      isLoginPage: !s.loggedIn,
      isAppShell: s.loggedIn,
      isDashboard: page === 'dashboard',
      isBorrowersList: page === 'borrowers',
      isBorrowerDetail: page === 'borrowerDetail',
      isLoansList: page === 'loans',
      isLoanDetail: page === 'loanDetail',
      isPaymentsList: page === 'payments',
      isReports: page === 'reports',
      isAdmin: page === 'admin',
      navItems: navMap,

      loginForm: s.loginForm,
      onLoginEmailChange: this.onLoginEmailChange,
      onLoginPasswordChange: this.onLoginPasswordChange,
      onLogin: this.onLogin,
      onLogout: this.onLogout,
      onToggleTheme: this.onToggleTheme,
      themeKnobLeft: s.theme === 'dark' ? '22px' : '2px',

      dashboardCounts, dashSearchBorrowers, dashSearchLoans, recentActivity, overdueBrief,
      goReports: this.goReports, goPayments: this.goPayments,
      recentPaymentsEnriched, overdueLoansEnriched, goLoans: this.goLoans,

      filteredBorrowers, borrowerSearch: s.borrowerSearch, onBorrowerSearchChange: this.onBorrowerSearchChange,
      openBorrower: this.openBorrower, openNewBorrowerModal: this.openNewBorrowerModal,

      selectedBorrower, selectedBorrowerLoans, goBorrowers: this.goBorrowers,
      openEditBorrowerModal: this.openEditBorrowerModal, openLoan: this.openLoan,
      openNewLoanModalForBorrower: this.openNewLoanModalForBorrower,

      filteredLoans, loanFilters: s.loanFilters, onLoanFilterChange: this.onLoanFilterChange,
      openNewLoanModal: this.openNewLoanModal, itemTypeOptions, metalTypeOptions,

      selectedLoanEnriched, openEditLoanModal: this.openEditLoanModal,
      openPaymentModalForLoan: this.openPaymentModalForLoan, onChangeLoanStatus: this.onChangeLoanStatus,

      filteredPayments, paymentFilters: s.paymentFilters, onPaymentFilterChange: this.onPaymentFilterChange,
      loanOptionsForFilter: allLoansEnriched.map(l => ({ _id: l._id, label: l.loanNumber + ' — ' + l.borrowerName })),

      reportSummary: dashboardStats, outstandingInterestReport, borrowerSummaryReport,

      interestConfig: s.interestConfig, adminUsers: s.adminUsers,
      openTierModal: this.openTierModal, openNewAdminUserModal: this.openNewAdminUserModal, onDeactivateUser: this.onDeactivateUser,

      borrowers: s.borrowers,

      showBorrowerModal: s.showBorrowerModal, borrowerForm: s.borrowerForm, editingBorrowerId: s.editingBorrowerId,
      onBorrowerFormChange: this.onBorrowerFormChange, onSaveBorrower: this.onSaveBorrower, closeBorrowerModal: this.closeBorrowerModal,

      showLoanModal: s.showLoanModal, loanForm: s.loanForm, editingLoanId: s.editingLoanId,
      onLoanFormChange: this.onLoanFormChange, onSaveLoan: this.onSaveLoan, closeLoanModal: this.closeLoanModal,

      showPaymentModal: s.showPaymentModal, paymentForm: s.paymentForm,
      onPaymentFormChange: this.onPaymentFormChange, onSavePayment: this.onSavePayment, closePaymentModal: this.closePaymentModal,

      showTierModal: s.showTierModal, tierDraft: s.tierDraft,
      onTierDraftChange: this.onTierDraftChange, onAddTier: this.onAddTier, onRemoveTier: this.onRemoveTier,
      onSaveTiers: this.onSaveTiers, closeTierModal: this.closeTierModal,

      showAdminUserModal: s.showAdminUserModal, adminUserForm: s.adminUserForm,
      onAdminUserFormChange: this.onAdminUserFormChange, onSaveAdminUser: this.onSaveAdminUser, closeAdminUserModal: this.closeAdminUserModal,

      toast: s.toast
    };
  }
}

</script>
</body>
</html>
