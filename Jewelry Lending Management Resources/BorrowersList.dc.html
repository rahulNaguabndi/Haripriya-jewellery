<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</helmet>
<div style="font-family:'Jost',sans-serif; color:var(--text);">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
    <div>
      <div style="font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700;">Borrowers</div>
      <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">{{ count }} borrowers on record</div>
    </div>
    <button onClick="{{ onNewBorrower }}" style="background:var(--ink); color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer;" style-hover="background:var(--ink-hover);">+ New borrower</button>
  </div>

  <div style="margin-bottom:16px;">
    <input type="text" value="{{ search }}" onChange="{{ onSearchChange }}" placeholder="Search by name or phone…" style="width:320px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); font-size:13.5px; outline:none;" />
  </div>

  <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden;">
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead>
        <tr style="background:var(--hover);">
          <th style="text-align:left; padding:11px 20px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.02em;">Name</th>
          <th style="text-align:left; padding:11px 12px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.02em;">Contact</th>
          <th style="text-align:left; padding:11px 12px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.02em;">Location</th>
          <th style="text-align:center; padding:11px 12px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.02em;">Loans</th>
          <th style="text-align:right; padding:11px 20px; font-weight:600; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:0.02em;">Outstanding</th>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{ borrowers }}" as="b" hint-placeholder-count="6">
          <tr onClick="{{ b.onClick }}" style="border-top:1px solid var(--divider); cursor:pointer;" style-hover="background:var(--hover);">
            <td style="padding:12px 20px; font-weight:600;">{{ b.name }}</td>
            <td style="padding:12px 12px; color:var(--text-3);">{{ b.phone }}</td>
            <td style="padding:12px 12px; color:var(--text-muted);">{{ b.city }}, {{ b.state }}</td>
            <td style="padding:12px 12px; text-align:center;">{{ b.loanCount }}</td>
            <td style="padding:12px 20px; text-align:right; font-weight:600;">{{ b.totalOutstanding }}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
    <sc-if value="{{ isEmpty }}">
      <div style="padding:32px; text-align:center; color:var(--text-muted); font-size:13.5px;">No borrowers match your search.</div>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1100, &quot;height&quot;: 600}}">
class Component extends DCLogic {
  renderVals() {
    const list = this.props.borrowers || [];
    const onOpenBorrower = this.props.onOpenBorrower || (() => {});
    return {
      borrowers: list.map(b => ({ ...b, onClick: () => onOpenBorrower(b._id) })),
      count: list.length,
      isEmpty: list.length === 0,
      search: this.props.search || '',
      onSearchChange: this.props.onSearchChange,
      onNewBorrower: this.props.onNewBorrower
    };
  }
}

</script>
</body>
</html>
