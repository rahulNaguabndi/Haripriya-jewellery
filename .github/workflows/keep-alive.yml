name: Keep Supabase + Render awake

# Supabase free tier pauses a project after 7 days of DB inactivity, and the
# Render free web service spins down after ~15 min idle (~50s cold start).
# This runs daily: it warms the Render server and issues a real DB read via
# GET /api/theme (no auth, reads the brand_theme table) — one hit keeps both alive.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}    # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://haripriya-jewellery.onrender.com
    steps:
      - name: Wake Render server (retry through cold start)
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$BASE_URL/api/health" || echo 000)
            echo "attempt $i: /api/health -> $code"
            [ "$code" = "200" ] && break
            sleep 15
          done

      - name: Hit DB via /api/theme (keeps Supabase active)
        run: |
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' --max-time 90 "$BASE_URL/api/theme" || echo 000)
          echo "/api/theme -> $code"
          cat /tmp/body.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::DB ping failed (HTTP $code) — Supabase may not have been touched"
            exit 1
          fi
